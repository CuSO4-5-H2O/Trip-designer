name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -name '*.js' -print0)

      - name: Verify legacy frontend files are removed
        shell: bash
        run: |
          set -euo pipefail
          legacy_files=(
            app.js
            mobile-fast-edit.js
            order-controls.js
            trip-insights.js
            trip-insights.css
            travel-tools.js
            travel-tools-actions.js
            travel-tools.css
            activity-tags.js
            activity-tags.css
            context-popover-fixes.js
            context-popover-fixes.css
            config.js
            server-first.js
            seed-room-1075424A.js
            imported-itinerary.js
            inline-edit.js
            inline-edit.css
            layout-fix.css
            transport-multiselect.js
            transport-multiselect.css
            entry-actions.js
            map-providers.js
          )
          for file in "${legacy_files[@]}"; do
            test ! -e "$file"
          done

      - name: Guard add activity controls
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'setInterval' entry-actions-lite.js
          ! grep -q 'enhanceDayCards' entry-actions-lite.js
          ! grep -q 'actions.prepend' entry-actions-lite.js
          ! grep -q 'quick-plan-toggle' entry-actions-lite.js
          ! grep -q 'toggle-quick-plan' entry-actions-lite.js
          grep -q 'TripPlannerQuickAdd' entry-actions-lite.js
          grep -q 'TripPlannerQuickAdd' interaction-hotfix.js
          grep -q 'quickActivityModal' interaction-hotfix.js
          grep -q 'saveExternalLibrary' interaction-hotfix.js
          grep -q 'stopImmediatePropagation' interaction-hotfix.js
          grep -q 'day-card-add-floating' interaction-hotfix.js

      - name: Guard room entry behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'tripdesigner:last-room' room-bootstrap.js
          grep -q 'showRoomGate' room-bootstrap.js
          grep -q '进入同一个房间' room-bootstrap.js
          grep -Eq 'APP_BUILD_VERSION = "render-[0-9a-z]+"' room-bootstrap.js
          grep -q 'app-collab.js?v=${APP_BUILD_VERSION}' room-bootstrap.js
          ! grep -q 'DEFAULT_ROOM_ID = "1075424A"' room-bootstrap.js
          ! grep -q 'if (!roomId) return;' room-bootstrap.js
          ! grep -q './app-collab.js?v=' index.html

      - name: Start runtime and verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4177
          export DATA_DIR="$RUNNER_TEMP/trip-designer-runtime-data"
          export deepseek="ci-placeholder-key"
          export gaodemap_key="ci-placeholder-amap-key"
          export gaodemap_securitycode="ci-placeholder-amap-security"
          export googlemap="ci-placeholder-google-key"
          export AI_RATE_LIMIT=12
          export AI_CONCURRENCY_LIMIT=3
          node runtime.js >"$RUNNER_TEMP/runtime.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/runtime.log"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4177/healthz >"$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 0.25
          done

          cat "$RUNNER_TEMP/health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/health.json"
          grep -q '"aiConfigured":true' "$RUNNER_TEMP/health.json"

          curl --fail --silent http://127.0.0.1:4177/api/cloud-storage-status >"$RUNNER_TEMP/cloud-status.json"
          cat "$RUNNER_TEMP/cloud-status.json"
          grep -q '"ok":true' "$RUNNER_TEMP/cloud-status.json"

          ai_status_code=$(curl --silent --output "$RUNNER_TEMP/ai-recommend-method.json" --write-out "%{http_code}" http://127.0.0.1:4177/api/ai/recommend)
          cat "$RUNNER_TEMP/ai-recommend-method.json"
          test "$ai_status_code" = "405"
          grep -q '"method not allowed"' "$RUNNER_TEMP/ai-recommend-method.json"

          curl --fail --silent http://127.0.0.1:4177/api/map-config >"$RUNNER_TEMP/map-config.json"
          cat "$RUNNER_TEMP/map-config.json"
          grep -q '"ok":true' "$RUNNER_TEMP/map-config.json"
          grep -q '"defaultProvider":"amap"' "$RUNNER_TEMP/map-config.json"
          grep -q '"google"' "$RUNNER_TEMP/map-config.json"

          curl --fail --silent 'http://127.0.0.1:4177/api/room-state?room=1075424A' >"$RUNNER_TEMP/room-state.json"
          grep -q '"ok":true' "$RUNNER_TEMP/room-state.json"

          curl --fail --silent 'http://127.0.0.1:4177/?room=1075424A' >"$RUNNER_TEMP/index.html"
          grep -q 'name="trip-build"' "$RUNNER_TEMP/index.html"
          grep -Eq './room-bootstrap.js\?v=render-[0-9a-z]+' "$RUNNER_TEMP/index.html"
          grep -q './input-performance.js' "$RUNNER_TEMP/index.html"
          grep -q './cloud-only-storage-guard.js' "$RUNNER_TEMP/index.html"
          grep -q './sync-throttle.js' "$RUNNER_TEMP/index.html"
          grep -q './cloud-sync-guard.js' "$RUNNER_TEMP/index.html"
          ! grep -q './app-collab.js?v=' "$RUNNER_TEMP/index.html"
          grep -q './connection-guard.js' "$RUNNER_TEMP/index.html"
          grep -q './map-providers-lite.js' "$RUNNER_TEMP/index.html"
          grep -q './quick-plan.js' "$RUNNER_TEMP/index.html"
          grep -q './document-import.js' "$RUNNER_TEMP/index.html"
          grep -q './list-plus-menu.js' "$RUNNER_TEMP/index.html"
          grep -q './timeline-ui-cleanup.js' "$RUNNER_TEMP/index.html"
          grep -q './interaction-hotfix.js' "$RUNNER_TEMP/index.html"
          grep -q './cloud-authority-refresh.js' "$RUNNER_TEMP/index.html"
          grep -q './mobile-performance-lite.js' "$RUNNER_TEMP/index.html"
          grep -q './layout-stability-hotfix.js' "$RUNNER_TEMP/index.html"
          grep -q './room-status-warning.js' "$RUNNER_TEMP/index.html"
          grep -q './context-editor-performance.css' "$RUNNER_TEMP/index.html"
          grep -q './entry-actions-lite.js' "$RUNNER_TEMP/index.html"
          grep -q './room-login.js' "$RUNNER_TEMP/index.html"
          grep -q './inline-polish.js' "$RUNNER_TEMP/index.html"
          grep -q './inline-anchor-preview.js' "$RUNNER_TEMP/index.html"
          grep -q './collapse-performance.js' "$RUNNER_TEMP/index.html"
          ! grep -Eq 'config\.js|server-first\.js|trip-insights|travel-tools|activity-tags|context-popover-fixes|leaflet' "$RUNNER_TEMP/index.html"
          ! grep -q './map-providers.js?v=' "$RUNNER_TEMP/index.html"
          ! grep -q './entry-actions.js?v=' "$RUNNER_TEMP/index.html"

          curl --fail --silent 'http://127.0.0.1:4177/room-bootstrap.js' >"$RUNNER_TEMP/room-bootstrap.js"
          grep -Eq 'APP_BUILD_VERSION = "render-[0-9a-z]+"' "$RUNNER_TEMP/room-bootstrap.js"
          grep -q 'app-collab.js?v=${APP_BUILD_VERSION}' "$RUNNER_TEMP/room-bootstrap.js"
          grep -q '进入同一个房间' "$RUNNER_TEMP/room-bootstrap.js"

          assets=(
            room-bootstrap.js
            input-performance.js
            cloud-only-storage-guard.js
            sync-throttle.js
            cloud-sync-guard.js
            app-collab.js
            inline-activity-template.js
            connection-guard.js
            map-providers-lite.js
            quick-plan.js
            document-import.js
            list-plus-menu.js
            timeline-ui-cleanup.js
            interaction-hotfix.js
            cloud-authority-refresh.js
            mobile-performance-lite.js
            layout-stability-hotfix.js
            room-status-warning.js
            room-login.js
            inline-polish.js
            inline-anchor-preview.js
            collapse-performance.js
            entry-actions-lite.js
            styles.css
            room-loading.css
            quick-plan.css
            ux-polish.css
            context-editor-performance.css
            map-providers.css
            entry-actions.css
          )
          for asset in "${assets[@]}"; do
            curl --fail --silent "http://127.0.0.1:4177/$asset" >/dev/null
          done

      - name: Verify direct Render server entry
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4178
          export DATA_DIR="$RUNNER_TEMP/trip-designer-server-data"
          export gaodemap_key="ci-placeholder-amap-key"
          export gaodemap_securitycode="ci-placeholder-amap-security"
          export googlemap="ci-placeholder-google-key"
          node server.js >"$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4178/api/map-config >"$RUNNER_TEMP/server-map-config.json"; then
              break
            fi
            sleep 0.25
          done

          cat "$RUNNER_TEMP/server-map-config.json"
          grep -q '"ok":true' "$RUNNER_TEMP/server-map-config.json"
          grep -q '"defaultProvider":"amap"' "$RUNNER_TEMP/server-map-config.json"
