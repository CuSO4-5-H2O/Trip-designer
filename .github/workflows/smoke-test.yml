name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -name '*.js' -print0)

      - name: Start server and verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4177
          export DATA_DIR="$RUNNER_TEMP/trip-designer-data"
          export deepseek="ci-placeholder-key"
          export gaodemap_key="ci-placeholder-amap-key"
          export gaodemap_securitycode="ci-placeholder-amap-security"
          export googlemap="ci-placeholder-google-key"
          export AI_RATE_LIMIT=12
          export AI_CONCURRENCY_LIMIT=3
          node runtime.js >"$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4177/healthz >"$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 0.25
          done

          cat "$RUNNER_TEMP/health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/health.json"
          grep -q '"aiConfigured":true' "$RUNNER_TEMP/health.json"

          curl --fail --silent http://127.0.0.1:4177/api/ai-status >"$RUNNER_TEMP/ai-status.json"
          cat "$RUNNER_TEMP/ai-status.json"
          grep -q '"configured":true' "$RUNNER_TEMP/ai-status.json"
          grep -q '"model":"deepseek-chat"' "$RUNNER_TEMP/ai-status.json"

          curl --fail --silent http://127.0.0.1:4177/api/map-config >"$RUNNER_TEMP/map-config.json"
          cat "$RUNNER_TEMP/map-config.json"
          grep -q '"ok":true' "$RUNNER_TEMP/map-config.json"
          grep -q '"defaultProvider":"amap"' "$RUNNER_TEMP/map-config.json"
          grep -q '"google"' "$RUNNER_TEMP/map-config.json"

          curl --fail --silent http://127.0.0.1:4177/ >"$RUNNER_TEMP/index.html"
          grep -q './app-collab.js' "$RUNNER_TEMP/index.html"
          grep -q './map-providers.js?v=map-20260712a' "$RUNNER_TEMP/index.html"
          grep -q './map-providers.css?v=map-20260712a' "$RUNNER_TEMP/index.html"
          ! grep -q 'leaflet' "$RUNNER_TEMP/index.html"
