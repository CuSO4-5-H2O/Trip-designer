name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -name '*.js' -print0)

      - name: Verify legacy frontend files are removed
        shell: bash
        run: |
          set -euo pipefail
          legacy_files=(
            app.js
            mobile-fast-edit.js
            order-controls.js
            trip-insights.js
            trip-insights.css
            travel-tools.js
            travel-tools-actions.js
            travel-tools.css
            activity-tags.js
            activity-tags.css
            context-popover-fixes.js
            context-popover-fixes.css
            config.js
            server-first.js
            seed-room-1075424A.js
            imported-itinerary.js
            inline-edit.js
            inline-edit.css
            layout-fix.css
            transport-multiselect.js
            transport-multiselect.css
            entry-actions.js
            map-providers.js
          )
          for file in "${legacy_files[@]}"; do
            test ! -e "$file"
          done

      - name: Guard add activity controls
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'setInterval' entry-actions-lite.js
          ! grep -Fq 'enhanceDayCards' entry-actions-lite.js
          ! grep -Fq 'actions.prepend' entry-actions-lite.js
          ! grep -Fq 'quick-plan-toggle' entry-actions-lite.js
          ! grep -Fq 'toggle-quick-plan' entry-actions-lite.js
          grep -Fq 'TripPlannerQuickAdd' entry-actions-lite.js
          grep -Fq 'TripPlannerQuickAdd' interaction-hotfix.js
          grep -Fq 'quickActivityModal' interaction-hotfix.js
          grep -Fq 'saveExternalLibrary' interaction-hotfix.js
          grep -Fq 'stopImmediatePropagation' interaction-hotfix.js
          grep -Fq 'day-card-add-floating' interaction-hotfix.js

      - name: Guard room entry behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const room = fs.readFileSync('room-bootstrap.js', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const assert = (condition, message) => {
            if (!condition) {
              console.error(message);
              process.exit(1);
            }
          };
          for (const token of ['tripdesigner:last-room', 'showRoomGate', '进入同一个房间', 'app-collab.js?v=${APP_BUILD_VERSION}']) {
            assert(room.includes(token), `room-bootstrap.js missing ${token}`);
          }
          assert(/APP_BUILD_VERSION = "render-[0-9a-z]+"/.test(room), 'room-bootstrap.js missing dynamic render build version');
          assert(!room.includes('DEFAULT_ROOM_ID = "1075424A"'), 'room-bootstrap.js must not force the old shared room');
          assert(!room.includes('if (!roomId) return;'), 'room-bootstrap.js must show the room entry gate when room is missing');
          assert(!index.includes('./app-collab.js?v='), 'index.html must let room-bootstrap load app-collab with the active room');
          NODE

      - name: Start runtime and verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4177
          export DATA_DIR="$RUNNER_TEMP/trip-designer-runtime-data"
          export deepseek="ci-placeholder-key"
          export gaodemap_key="ci-placeholder-amap-key"
          export gaodemap_securitycode="ci-placeholder-amap-security"
          export googlemap="ci-placeholder-google-key"
          export AI_RATE_LIMIT=12
          export AI_CONCURRENCY_LIMIT=3
          node runtime.js >"$RUNNER_TEMP/runtime.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/runtime.log"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4177/healthz >"$RUNNER_TEMP/health.json"; then
              break
            fi
            sleep 0.25
          done

          curl --fail --silent http://127.0.0.1:4177/api/cloud-storage-status >"$RUNNER_TEMP/cloud-status.json"
          ai_status_code=$(curl --silent --output "$RUNNER_TEMP/ai-recommend-method.json" --write-out "%{http_code}" http://127.0.0.1:4177/api/ai/recommend)
          test "$ai_status_code" = "405"
          curl --fail --silent http://127.0.0.1:4177/api/map-config >"$RUNNER_TEMP/map-config.json"
          curl --fail --silent 'http://127.0.0.1:4177/api/room-state?room=1075424A' >"$RUNNER_TEMP/room-state.json"
          curl --fail --silent 'http://127.0.0.1:4177/?room=1075424A' >"$RUNNER_TEMP/index.html"
          curl --fail --silent 'http://127.0.0.1:4177/room-bootstrap.js' >"$RUNNER_TEMP/room-bootstrap.js"

          node <<'NODE'
          const fs = require('fs');
          const readJson = (file) => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${file}`, 'utf8'));
          const readText = (file) => fs.readFileSync(`${process.env.RUNNER_TEMP}/${file}`, 'utf8');
          const assert = (condition, message) => {
            if (!condition) {
              console.error(message);
              process.exit(1);
            }
          };
          const health = readJson('health.json');
          const cloud = readJson('cloud-status.json');
          const aiMethod = readJson('ai-recommend-method.json');
          const mapConfig = readJson('map-config.json');
          const roomState = readJson('room-state.json');
          const index = readText('index.html');
          const roomBootstrap = readText('room-bootstrap.js');

          assert(health.ok === true, 'healthz did not return ok:true');
          assert(health.aiConfigured === true, 'healthz did not report aiConfigured:true');
          assert(cloud.ok === true, 'cloud storage status did not return ok:true');
          assert(aiMethod.error === 'method not allowed', 'GET /api/ai/recommend should be rejected with method not allowed');
          assert(mapConfig.ok === true, 'map config did not return ok:true');
          assert(mapConfig.defaultProvider === 'amap', 'map config default provider should be amap');
          assert(Array.isArray(mapConfig.providers) && mapConfig.providers.includes('google'), 'map config should include google provider');
          assert(roomState.ok === true, 'room-state did not return ok:true');

          const requiredIndexTokens = [
            'name="trip-build"',
            './room-bootstrap.js?v=render-',
            './input-performance.js',
            './cloud-only-storage-guard.js',
            './sync-throttle.js',
            './cloud-sync-guard.js',
            './connection-guard.js',
            './map-providers-lite.js',
            './quick-plan.js',
            './document-import.js',
            './list-plus-menu.js',
            './timeline-ui-cleanup.js',
            './interaction-hotfix.js',
            './cloud-authority-refresh.js',
            './mobile-performance-lite.js',
            './layout-stability-hotfix.js',
            './room-status-warning.js',
            './context-editor-performance.css',
            './entry-actions-lite.js',
            './room-login.js',
            './inline-polish.js',
            './inline-anchor-preview.js',
            './collapse-performance.js',
          ];
          for (const token of requiredIndexTokens) assert(index.includes(token), `index.html missing ${token}`);
          for (const token of ['config.js', 'server-first.js', 'trip-insights', 'travel-tools', 'activity-tags', 'context-popover-fixes', 'leaflet', './map-providers.js?v=', './entry-actions.js?v=', './app-collab.js?v=']) {
            assert(!index.includes(token), `index.html still references legacy token ${token}`);
          }
          assert(/APP_BUILD_VERSION = "render-[0-9a-z]+"/.test(roomBootstrap), 'served room-bootstrap missing render build version');
          assert(roomBootstrap.includes('app-collab.js?v=${APP_BUILD_VERSION}'), 'served room-bootstrap missing dynamic app-collab load');
          assert(roomBootstrap.includes('进入同一个房间'), 'served room-bootstrap missing room entry text');
          NODE

          assets=(
            room-bootstrap.js
            input-performance.js
            cloud-only-storage-guard.js
            sync-throttle.js
            cloud-sync-guard.js
            app-collab.js
            inline-activity-template.js
            connection-guard.js
            map-providers-lite.js
            quick-plan.js
            document-import.js
            list-plus-menu.js
            timeline-ui-cleanup.js
            interaction-hotfix.js
            cloud-authority-refresh.js
            mobile-performance-lite.js
            layout-stability-hotfix.js
            room-status-warning.js
            room-login.js
            inline-polish.js
            inline-anchor-preview.js
            collapse-performance.js
            entry-actions-lite.js
            styles.css
            room-loading.css
            quick-plan.css
            ux-polish.css
            context-editor-performance.css
            map-providers.css
            entry-actions.css
          )
          for asset in "${assets[@]}"; do
            curl --fail --silent "http://127.0.0.1:4177/$asset" >/dev/null
          done

      - name: Verify direct Render server entry
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4178
          export DATA_DIR="$RUNNER_TEMP/trip-designer-server-data"
          export gaodemap_key="ci-placeholder-amap-key"
          export gaodemap_securitycode="ci-placeholder-amap-security"
          export googlemap="ci-placeholder-google-key"
          node server.js >"$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4178/api/map-config >"$RUNNER_TEMP/server-map-config.json"; then
              break
            fi
            sleep 0.25
          done

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/server-map-config.json`, 'utf8'));
          if (payload.ok !== true) throw new Error('server.js map config did not return ok:true');
          if (payload.defaultProvider !== 'amap') throw new Error('server.js map config default provider should be amap');
          NODE
