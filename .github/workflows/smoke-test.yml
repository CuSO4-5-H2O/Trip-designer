name: Smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -name '*.js' -print0)

      - name: Check critical frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = (file) => fs.readFileSync(file, 'utf8');
          const assert = (condition, message) => {
            if (!condition) {
              console.error(message);
              process.exit(1);
            }
          };
          const index = read('index.html');
          const roomBootstrap = read('room-bootstrap.js');
          const entryActions = read('entry-actions-lite.js');
          const interactionHotfix = read('interaction-hotfix.js');
          const legacyFiles = [
            'app.js', 'mobile-fast-edit.js', 'order-controls.js', 'trip-insights.js',
            'trip-insights.css', 'travel-tools.js', 'travel-tools-actions.js',
            'travel-tools.css', 'activity-tags.js', 'activity-tags.css',
            'context-popover-fixes.js', 'context-popover-fixes.css', 'config.js',
            'server-first.js', 'seed-room-1075424A.js', 'imported-itinerary.js',
            'inline-edit.js', 'inline-edit.css', 'layout-fix.css',
            'transport-multiselect.js', 'transport-multiselect.css',
            'entry-actions.js', 'map-providers.js',
          ];
          for (const file of legacyFiles) assert(!fs.existsSync(file), `legacy file should not exist: ${file}`);
          assert(index.includes('name="trip-build"'), 'index.html missing trip-build marker');
          assert(index.includes('./room-bootstrap.js?v=render-'), 'index.html missing room-bootstrap render asset');
          assert(!index.includes('./app-collab.js?v='), 'index.html must let room-bootstrap load app-collab for the active room');
          assert(/APP_BUILD_VERSION = "render-[0-9a-z]+"/.test(roomBootstrap), 'room-bootstrap.js missing render build version');
          assert(roomBootstrap.includes('if (!roomId) {') && roomBootstrap.includes('showRoomGate();'), 'room-bootstrap.js must show the room gate when room is missing');
          assert(roomBootstrap.includes('app-collab.js?v=${APP_BUILD_VERSION}'), 'room-bootstrap.js missing dynamic app-collab load');
          assert(!roomBootstrap.includes('DEFAULT_ROOM_ID = "1075424A"'), 'room-bootstrap.js must not force the old shared room');
          assert(!roomBootstrap.includes('if (!roomId) return;'), 'room-bootstrap.js must not silently stop without a room');
          for (const token of ['TripPlannerQuickAdd', 'quickActivityModal', 'saveExternalLibrary', 'stopImmediatePropagation', 'day-card-add-floating']) {
            assert((entryActions + interactionHotfix).includes(token), `missing add-activity control token: ${token}`);
          }
          NODE

      - name: Start runtime and verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4177
          export DATA_DIR="$RUNNER_TEMP/trip-designer-runtime-data"
          export deepseek="ci-placeholder-key"
          export gaodemap_key="ci-placeholder-amap-key"
          export gaodemap_securitycode="ci-placeholder-amap-security"
          export googlemap="ci-placeholder-google-key"
          export AI_RATE_LIMIT=12
          export AI_CONCURRENCY_LIMIT=3
          node runtime.js >"$RUNNER_TEMP/runtime.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/runtime.log"' EXIT

          node <<'NODE'
          (async () => {
            const assert = (condition, message) => {
              if (!condition) throw new Error(message);
            };
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const base = 'http://127.0.0.1:4177';
            async function request(path, options = {}) {
              const response = await fetch(`${base}${path}`, options);
              const text = await response.text();
              let json = null;
              try { json = JSON.parse(text); } catch {}
              return { response, text, json };
            }
            let health = null;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                health = await request('/healthz');
                if (health.response.ok) break;
              } catch {}
              await sleep(250);
            }
            assert(health?.response?.ok, 'runtime /healthz did not become ready');
            assert(health.json?.ok === true, 'healthz did not return ok:true');
            assert(health.json?.aiConfigured === true, 'healthz did not report aiConfigured:true');

            const cloud = await request('/api/cloud-storage-status');
            assert(cloud.response.ok && cloud.json?.ok === true, 'cloud storage status failed');

            const aiMethod = await request('/api/ai/recommend');
            assert(aiMethod.response.status === 405, 'GET /api/ai/recommend should return 405');
            assert(aiMethod.json?.error === 'method not allowed', 'GET /api/ai/recommend should say method not allowed');

            const mapConfig = await request('/api/map-config');
            assert(mapConfig.response.ok && mapConfig.json?.ok === true, 'map config failed');
            assert(mapConfig.json?.defaultProvider === 'amap', 'map default provider should be amap');
            assert(JSON.stringify(mapConfig.json).includes('google'), 'map config should include google provider');

            const roomState = await request('/api/room-state?room=1075424A');
            assert(roomState.response.ok && roomState.json?.ok === true, 'room-state failed');

            const index = await request('/?room=1075424A');
            assert(index.response.ok, 'index failed');
            for (const token of [
              'name="trip-build"', './room-bootstrap.js?v=render-', './input-performance.js',
              './cloud-only-storage-guard.js', './sync-throttle.js', './cloud-sync-guard.js',
              './connection-guard.js', './map-providers-lite.js', './quick-plan.js',
              './document-import.js', './list-plus-menu.js', './timeline-ui-cleanup.js',
              './interaction-hotfix.js', './cloud-authority-refresh.js', './mobile-performance-lite.js',
              './layout-stability-hotfix.js', './room-status-warning.js',
              './context-editor-performance.css', './entry-actions-lite.js', './room-login.js',
              './inline-polish.js', './inline-anchor-preview.js', './collapse-performance.js',
            ]) {
              assert(index.text.includes(token), `served index missing ${token}`);
            }
            for (const token of ['config.js', 'server-first.js', 'trip-insights', 'travel-tools', 'activity-tags', 'context-popover-fixes', 'leaflet', './map-providers.js?v=', './entry-actions.js?v=', './app-collab.js?v=']) {
              assert(!index.text.includes(token), `served index references legacy token ${token}`);
            }

            const assets = [
              'room-bootstrap.js', 'input-performance.js', 'cloud-only-storage-guard.js',
              'sync-throttle.js', 'cloud-sync-guard.js', 'app-collab.js',
              'inline-activity-template.js', 'connection-guard.js', 'map-providers-lite.js',
              'quick-plan.js', 'document-import.js', 'list-plus-menu.js',
              'timeline-ui-cleanup.js', 'interaction-hotfix.js', 'cloud-authority-refresh.js',
              'mobile-performance-lite.js', 'layout-stability-hotfix.js', 'room-status-warning.js',
              'room-login.js', 'inline-polish.js', 'inline-anchor-preview.js',
              'collapse-performance.js', 'entry-actions-lite.js', 'styles.css',
              'room-loading.css', 'quick-plan.css', 'ux-polish.css',
              'context-editor-performance.css', 'map-providers.css', 'entry-actions.css',
            ];
            for (const asset of assets) {
              const result = await request(`/${asset}`);
              assert(result.response.ok, `asset failed: ${asset}`);
            }
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

      - name: Verify direct Render server entry
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4178
          export DATA_DIR="$RUNNER_TEMP/trip-designer-server-data"
          export gaodemap_key="ci-placeholder-amap-key"
          export gaodemap_securitycode="ci-placeholder-amap-security"
          export googlemap="ci-placeholder-google-key"
          node server.js >"$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT

          node <<'NODE'
          (async () => {
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let payload = null;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                const response = await fetch('http://127.0.0.1:4178/api/map-config');
                payload = await response.json();
                if (response.ok) break;
              } catch {}
              await sleep(250);
            }
            if (payload?.ok !== true) throw new Error('server.js map config did not return ok:true');
            if (payload.defaultProvider !== 'amap') throw new Error('server.js map config default provider should be amap');
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE
