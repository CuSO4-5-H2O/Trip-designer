name: WebSocket smoke test

# Manual only. This keeps the check available without sending notification mail
# on every push while the live editor is being repaired.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start server and verify room synchronization
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4177
          export DATA_DIR="$RUNNER_TEMP/trip-designer-websocket-data"
          node runtime.js >"$RUNNER_TEMP/websocket-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/websocket-server.log"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4177/healthz >/dev/null; then
              break
            fi
            sleep 0.25
          done

          node ws-smoke-test.js 'ws://127.0.0.1:4177/sync?room=1075424A'
