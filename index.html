<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="trip-build" content="render-20260713ad" />
    <title>行程编辑器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317211f'/%3E%3Cpath d='M13 34 28 11l8 19 17-7-14 30-8-19-18 7Z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css?v=render-20260713e" />
    <link rel="stylesheet" href="./room-loading.css?v=render-20260713e" />
    <link rel="stylesheet" href="./quick-plan.css?v=render-20260713e" />
    <link rel="stylesheet" href="./ux-polish.css?v=render-20260713e" />
    <link rel="stylesheet" href="./context-editor-performance.css?v=render-20260713e" />
    <link rel="stylesheet" href="./map-providers.css?v=render-20260713e" />
    <link rel="stylesheet" href="./entry-actions.css?v=render-20260713e" />
    <script src="./sync-throttle.js?v=render-20260713ab"></script>
    <script src="./room-bootstrap.js?v=render-20260713y"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M4.5 12.5 10 4l3 7 6.5-2.5L14 20l-3-7-6.5 2.5Z" />
            </svg>
          </span>
          <div>
            <p class="eyeline">行程编辑器</p>
            <input id="tripTitle" class="title-input" aria-label="行程名称" />
          </div>
        </div>
        <div class="top-actions">
          <div class="sync-state" id="syncState" title="render-20260713ad">
            <span class="pulse"></span>
            <span id="syncText">正在启动 · render-20260713ad</span>
          </div>
          <button class="icon-button" id="copyLinkBtn" type="button" aria-label="复制协作链接" title="复制协作链接">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.08l-1.15 1.15" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.08l1.15-1.15" />
            </svg>
          </button>
          <button class="primary-action" id="addDayTopBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            添加日期
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="行程设置">
          <section class="panel list-panel">
            <div class="section-heading">
              <p>行程单</p>
              <button class="mini-action" id="addListBtn" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
                新建
              </button>
            </div>
            <div class="trip-list" id="tripList"></div>
            <label class="field list-name-field">
              <span>重命名当前 list</span>
              <input id="listNameInput" type="text" placeholder="例如：大阪周末行" />
            </label>
          </section>

          <section class="panel trip-panel">
            <div class="section-heading">
              <p>行程设置</p>
              <span id="roomCode">LOCAL</span>
            </div>
            <label class="field">
              <span>开始日期</span>
              <input id="startDate" type="date" />
            </label>
            <label class="field range-field">
              <span>天数上限 <strong id="dayLimitValue">30 天</strong></span>
              <input id="dayLimitInput" type="range" min="1" max="60" step="1" />
            </label>
            <label class="field">
              <span>出发城市</span>
              <input id="originCity" type="text" placeholder="例如：上海" />
            </label>
            <label class="field">
              <span>同行成员</span>
              <input id="memberName" type="text" placeholder="输入你的名字" />
            </label>
            <div class="member-strip" id="memberStrip"></div>
          </section>

          <section class="panel compact-panel">
            <div class="section-heading">
              <p>概览</p>
              <span id="dayCount">0 天</span>
            </div>
            <div class="stat-grid">
              <div><strong id="activityCount">0</strong><span>事项</span></div>
              <div><strong id="stayCount">0</strong><span>住宿</span></div>
            </div>
            <div class="transport-summary" id="transportSummary"></div>
          </section>
        </aside>

        <section class="timeline-section" aria-label="每日行程列表">
          <div class="timeline-head">
            <div>
              <p class="eyeline">每日列表</p>
              <h1>把每天要做的事排清楚</h1>
            </div>
            <button class="ghost-action" id="addDayBtn" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 2v4M16 2v4M3 10h18" />
                <path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z" />
              </svg>
              添加日期
            </button>
          </div>
          <div class="day-list" id="dayList"></div>
        </section>

        <aside class="detail-panel" aria-label="当天详情">
          <div class="detail-sticky">
            <div class="section-heading">
              <p id="detailLabel">第 1 天</p>
              <span class="detail-heading-actions">
                <button class="icon-button mobile-detail-close" id="mobileDetailCloseBtn" type="button" aria-label="收起编辑面板" title="收起编辑面板">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
                </button>
                <button class="icon-button danger" id="deleteDayBtn" type="button" aria-label="删除当天" title="删除当天">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15" /></svg>
                </button>
              </span>
            </div>

            <label class="field"><span>当天地点</span><input id="detailLocation" type="text" placeholder="例如：东京 / 河口湖" /></label>
            <label class="field"><span>住宿</span><input id="detailStay" type="text" placeholder="酒店、民宿或露营地" /></label>

            <form class="activity-form" id="activityForm">
              <span class="field-label" id="activityFormLabel">添加事项</span>
              <div class="two-col compact">
                <input id="activityTime" type="time" required aria-label="事项时间" />
                <input id="activityPlace" type="text" placeholder="地点" aria-label="事项地点" />
              </div>
              <input id="activityTitle" type="text" placeholder="要做的事情" required aria-label="事项标题" />
              <div class="activity-transport">
                <div class="form-subheading"><span class="field-label">事项交通</span><button class="mini-action muted" id="clearTransportBtn" type="button">无交通</button></div>
                <div class="transport-tabs" id="transportTabs"></div>
                <div class="two-col"><input id="transportFrom" type="text" placeholder="出发地" aria-label="交通出发地" /><input id="transportTo" type="text" placeholder="到达地" aria-label="交通到达地" /></div>
                <div class="two-col"><input id="transportDepart" type="time" aria-label="出发时间" /><input id="transportArrive" type="time" aria-label="到达时间" /></div>
              </div>
              <textarea id="activityNote" rows="3" placeholder="备注、票号、集合点"></textarea>
              <div class="form-actions">
                <button class="ghost-action full hidden" id="cancelEditActivityBtn" type="button">取消编辑</button>
                <button class="primary-action full" id="activitySubmitBtn" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg><span id="activitySubmitText">添加事项</span></button>
              </div>
            </form>
          </div>
        </aside>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./input-performance.js?v=render-20260713e" defer></script>
    <script src="./startup-cache-guard.js?v=render-20260713t"></script>
    <script src="./cloud-sync-guard.js?v=render-20260713h"></script>
    <script src="./connection-guard.js?v=render-20260713s"></script>
    <script src="./map-providers-lite.js?v=render-20260713j" defer></script>
    <script src="./quick-plan.js?v=render-20260713e" defer></script>
    <script src="./document-import.js?v=render-20260713i" defer></script>
    <script src="./list-plus-menu.js?v=render-20260713l" defer></script>
    <script src="./entry-actions-lite.js?v=render-20260713x" defer></script>
    <script src="./timeline-ui-cleanup.js?v=render-20260713m" defer></script>
    <script src="./interaction-hotfix.js?v=render-20260713x" defer></script>
    <script src="./cloud-authority-refresh.js?v=render-20260713s" defer></script>
    <script src="./mobile-performance-lite.js?v=render-20260713q" defer></script>
    <script src="./layout-stability-hotfix.js?v=render-20260713u" defer></script>
    <script src="./room-status-warning.js?v=render-20260713p" defer></script>
    <script src="./local-recovery.js?v=render-20260713k" defer></script>
    <script src="./inline-polish.js?v=render-20260713ad" defer></script>
  </body>
</html>
